name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # el HTML que se descarga tiene que ser el que sale de este código
      - name: releases/ está al día
        run: cmp dist/index.html releases/digital-twin-bodegas.html
